<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 배경 -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  
  <!-- 대화 말풍선 (포럼/커뮤니티 상징) - 노란색, 더 크게, 알파 낮춤 -->
  <g>
    <!-- 왼쪽 위 말풍선 -->
    <circle cx="25" cy="22" r="15" fill="#FFD700" opacity="0.7"/>
    <circle cx="22" cy="30" r="5" fill="#FFD700" opacity="0.7"/>
    
    <!-- 오른쪽 위 말풍선 -->
    <circle cx="75" cy="25" r="13" fill="#FFC107" opacity="0.65"/>
    <circle cx="78" cy="32" r="4" fill="#FFC107" opacity="0.65"/>
    
    <!-- 왼쪽 아래 말풍선 -->
    <circle cx="20" cy="75" r="12" fill="#FFEB3B" opacity="0.6"/>
    <circle cx="17" cy="83" r="4" fill="#FFEB3B" opacity="0.6"/>
  </g>
  
  <!-- N 이니셜 - 조금 크게 -->
  <text x="50" y="68" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">N</text>
</svg>
